services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencut
      POSTGRES_PASSWORD: opencut
      POSTGRES_DB: opencut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencut"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opencut:opencut@db:5432/opencut
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        DATABASE_URL: postgresql://opencut:opencut@db:5432/opencut
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-opencut-local-dev-secret-change-before-public-deployment}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
        NEXT_PUBLIC_MARBLE_API_URL: ${NEXT_PUBLIC_MARBLE_API_URL:-https://api.marblecms.com}
        NEXT_PUBLIC_DATABUDDY_CLIENT_ID: ${NEXT_PUBLIC_DATABUDDY_CLIENT_ID:-}
        UPSTASH_REDIS_REST_URL: http://serverless-redis-http:80
        UPSTASH_REDIS_REST_TOKEN: example_token
        MARBLE_WORKSPACE_KEY: ${MARBLE_WORKSPACE_KEY:-build-placeholder}
        FREESOUND_CLIENT_ID: ${FREESOUND_CLIENT_ID:-placeholder}
        FREESOUND_API_KEY: ${FREESOUND_API_KEY:-placeholder}
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opencut:opencut@db:5432/opencut
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-opencut-local-dev-secret-change-before-public-deployment}
      UPSTASH_REDIS_REST_URL: http://serverless-redis-http:80
      UPSTASH_REDIS_REST_TOKEN: example_token
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
      NEXT_PUBLIC_MARBLE_API_URL: ${NEXT_PUBLIC_MARBLE_API_URL:-https://api.marblecms.com}
      NEXT_PUBLIC_DATABUDDY_CLIENT_ID: ${NEXT_PUBLIC_DATABUDDY_CLIENT_ID:-}
      MARBLE_WORKSPACE_KEY: ${MARBLE_WORKSPACE_KEY:-placeholder}
      FREESOUND_CLIENT_ID: ${FREESOUND_CLIENT_ID:-placeholder}
      FREESOUND_API_KEY: ${FREESOUND_API_KEY:-placeholder}
    depends_on:
      migrate:
        condition: service_completed_successfully
      serverless-redis-http:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  default:
    name: opencut-network
