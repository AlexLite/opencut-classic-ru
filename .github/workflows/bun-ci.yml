name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "ci-only-placeholder-secret-at-least-32-characters"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 0.15.0

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build WASM
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint audit (legacy baseline)
        continue-on-error: true
        run: bun run lint:web

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Run tests
        working-directory: apps/web
        run: bun test

  database-schema:
    name: database migration drift
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate migration candidate
        working-directory: apps/web
        run: bun run db:generate

      - name: Check migration tree is unchanged
        run: |
          git status --short apps/web/migrations
          test -z "$(git status --porcelain -- apps/web/migrations)"

      - name: Upload generated migration candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-migration-candidate
          path: apps/web/migrations
          if-no-files-found: error

  self-hosted-smoke:
    name: self-hosted Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      BETTER_AUTH_SECRET: "ci-only-placeholder-secret-at-least-32-characters"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3100"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Start self-hosted stack
        run: docker compose up -d --build web

      - name: Wait for application health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify Redis and database path
        run: |
          status=$(curl --silent --show-error \
            --output /tmp/feedback-response.json \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data '{"message":"CI self-hosted smoke test"}' \
            http://127.0.0.1:3100/api/feedback)
          cat /tmp/feedback-response.json
          test "$status" = "201"

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Tear down self-hosted stack
        if: always()
        run: docker compose down --volumes --remove-orphans
