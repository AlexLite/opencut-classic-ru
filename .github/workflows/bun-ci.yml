name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/local-webcodecs-proxy-fallback]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  media-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      - name: Lint media diff
        working-directory: apps/web
        run: >-
          bunx eslint
          src/core/managers/media-manager.ts
          src/core/managers/renderer-manager.ts
          src/media/codec-info.ts
          src/media/codec-info.test.ts
          src/media/import-decode-decision.ts
          src/media/import-decode-decision.test.ts
          src/media/mediabunny.ts
          src/media/processing.ts
          src/media/proxy/export-media-fallback.ts
          src/media/proxy/export-media-fallback.test.ts
          src/media/proxy/ffmpeg-transcode.ts
          src/media/proxy/ffmpeg-transcode.test.ts
          src/media/proxy/local-video-proxy.ts
          src/media/proxy/proxy-cache.ts
          src/media/proxy/proxy-errors.ts
          src/media/proxy/proxy-errors.test.ts
          src/media/types.ts
          src/media/video-capability-inspector.ts
          src/media/webcodecs-capabilities.ts
          src/media/webcodecs-capabilities.test.ts
          src/services/renderer/scene-builder.ts
          src/services/renderer/scene-exporter.ts
          src/services/video-cache/service.ts

      - name: Run media tests
        working-directory: apps/web
        run: >-
          bun test
          src/media/codec-info.test.ts
          src/media/import-decode-decision.test.ts
          src/media/webcodecs-capabilities.test.ts
          src/media/proxy/proxy-errors.test.ts
          src/media/proxy/export-media-fallback.test.ts
          src/media/proxy/ffmpeg-transcode.test.ts
